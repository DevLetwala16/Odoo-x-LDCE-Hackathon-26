  <ellipse cx="24" cy="17" rx="17.3" ry="4.5" fill="none" stroke="#DCEFF0" stroke-width="1" opacity="0.4"/>
  <ellipse cx="24" cy="31" rx="17.3" ry="4.5" fill="none" stroke="#DCEFF0" stroke-width="1" opacity="0.4"/>

  <!-- Globe outline -->
